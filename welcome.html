<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Game Hub</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#eef2ff;background:#0b1020;font-synthesis:none;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
    *{box-sizing:border-box}
    body{min-width:320px;min-height:100vh;margin:0;background:radial-gradient(ellipse at 72% -18%,#1a2b55 0,transparent 42%),#0b1020}
    a{color:inherit;text-decoration:none}
    .topbar{height:72px;display:flex;align-items:center;gap:40px;padding:0 clamp(20px,5vw,76px);border-bottom:1px solid #ffffff12;background:#0b1020cc}
    .brand{display:inline-flex;align-items:center;gap:11px;font-size:16px;font-weight:750;letter-spacing:.08em}
    .brand-mark{width:34px;height:34px;display:grid;place-items:center;border:1px solid #6487ff55;border-radius:11px;background:linear-gradient(145deg,#3b64da,#8055da);box-shadow:0 6px 22px #554fe133;color:white}
    .brand-mark svg{width:19px;height:19px}
    .topnav{height:100%;display:flex;align-items:center;gap:28px;color:#98a4c1;font-size:14px}
    .topnav a{height:100%;display:flex;align-items:center;position:relative}
    .topnav a.active{color:#f2f5ff}
    .topnav a.active::after{content:"";position:absolute;bottom:0;left:0;right:0;height:2px;background:#8b9dff;border-radius:2px}
    .topbar-spacer{flex:1}
    .search{width:min(250px,28vw);height:38px;display:flex;align-items:center;gap:9px;padding:0 12px;border:1px solid #ffffff17;border-radius:9px;background:#ffffff08;color:#7f8aa7}
    .search svg{width:16px;height:16px;flex:none}
    .search input{width:100%;border:0;outline:0;background:transparent;color:#e9edfa;font:inherit;font-size:13px}
    .search input::placeholder{color:#7f8aa7}
    .profile{width:36px;height:36px;display:grid;place-items:center;border:1px solid #ffffff1c;border-radius:50%;background:#1a2340;color:#b7c3e5}
    .profile svg{width:18px;height:18px}
    main{width:min(1280px,100%);margin:0 auto;padding:54px clamp(20px,5vw,68px) 72px}
    .eyebrow{display:flex;align-items:center;gap:9px;margin:0 0 10px;color:#9ba8ce;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
    .eyebrow span{width:7px;height:7px;border-radius:50%;background:#88a0ff;box-shadow:0 0 12px #88a0ff}
    h1{margin:0;color:#f5f7ff;font-size:clamp(30px,4vw,42px);font-weight:650;letter-spacing:-.045em;line-height:1.15}
    .intro{margin:12px 0 0;color:#9ca8c4;font-size:15px;line-height:1.6}
    .toolbar{display:flex;align-items:center;gap:9px;margin-top:36px;padding-bottom:17px;border-bottom:1px solid #ffffff14}
    .tab{padding:9px 13px;border:1px solid transparent;border-radius:8px;color:#9ba7c3;font-size:13px;font-weight:600}
    .tab.active{border-color:#748bff44;background:#536dd521;color:#e4eaff}
    .tab.disabled{color:#59647e;cursor:not-allowed}
    .count{margin-left:auto;color:#75819f;font-size:12px}
    .empty-state{min-height:370px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px;text-align:center}
    .empty-icon{width:76px;height:76px;display:grid;place-items:center;margin-bottom:22px;border:1px solid #8ba0ff26;border-radius:24px;background:linear-gradient(145deg,#202d52aa,#171c34aa);color:#a6b4ff;box-shadow:0 20px 60px #03081665,inset 0 1px #ffffff10}
    .empty-icon svg{width:34px;height:34px}
    .empty-state h2{margin:0;color:#e7ebfa;font-size:20px;font-weight:620;letter-spacing:-.02em}
    .empty-state p{max-width:390px;margin:10px 0 0;color:#8995b1;font-size:14px;line-height:1.65}
    .library-note{display:inline-flex;align-items:center;gap:8px;margin-top:22px;padding:8px 11px;border:1px solid #ffffff12;border-radius:999px;background:#ffffff06;color:#8995b1;font-size:12px}
    .library-note svg{width:14px;height:14px;color:#8e9eff}
    @media(max-width:650px){.topbar{height:64px;gap:22px;padding:0 18px}.brand{font-size:0}.brand-mark{font-size:14px}.topnav{gap:17px;font-size:13px}.search{width:38px;padding:0;justify-content:center;border-color:transparent;background:transparent}.search input{display:none}.search svg{width:19px;height:19px}.profile{display:none}main{padding-top:40px}.toolbar{gap:4px}.tab{padding:8px 9px;font-size:12px}.empty-state{min-height:320px}}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="welcome.html" aria-label="Game Hub home"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8h10a4 4 0 0 1 3.8 5.2l-.7 2.3a2 2 0 0 1-3.3.9L14.5 14h-5l-2.3 2.4a2 2 0 0 1-3.3-.9l-.7-2.3A4 4 0 0 1 7 8Z"/><path d="M8 10v4M6 12h4M16 11h.01M18 13h.01"/></svg></span>GAME HUB</a>
    <nav class="topnav" aria-label="Main navigation"><a class="active" href="#library" aria-current="page">Library</a><a href="index.html">NDEx Home</a></nav>
    <span class="topbar-spacer"></span>
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input type="search" placeholder="Search games" disabled aria-label="Search games"></label>
    <span class="profile" aria-label="Player profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/></svg></span>
  </header>
  <main id="library">
    <p class="eyebrow"><span></span>Your collection</p>
    <h1>Game Library</h1>
    <p class="intro">Your games, all in one place.</p>
    <div class="toolbar" aria-label="Game library filters">
      <span class="tab active" aria-current="true">All games</span>
      <span class="tab disabled" aria-disabled="true">Favorites</span>
      <span class="tab disabled" aria-disabled="true">Recently played</span>
      <span class="count">0 games</span>
    </div>
    <section class="empty-state" aria-label="Empty game library">
      <div class="empty-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8h10a4 4 0 0 1 3.8 5.2l-.7 2.3a2 2 0 0 1-3.3.9L14.5 14h-5l-2.3 2.4a2 2 0 0 1-3.3-.9l-.7-2.3A4 4 0 0 1 7 8Z"/><path d="M8 10v4M6 12h4M16 11h.01M18 13h.01"/></svg></div>
      <h2>No games yet</h2>
      <p>Your library is ready. Games will show up here when they’re added.</p>
      <span class="library-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18"/></svg>Library is empty</span>
    </section>
  </main>
</body>
</html>
