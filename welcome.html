<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Game Hub</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#eef2ff;background:#0b1020;font-synthesis:none;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
    *{box-sizing:border-box}
    body{min-width:320px;min-height:100vh;margin:0;background:radial-gradient(ellipse at 72% -18%,#1a2b55 0,transparent 42%),#0b1020}
    a{color:inherit;text-decoration:none}
    .topbar{height:72px;display:flex;align-items:center;gap:40px;padding:0 clamp(20px,5vw,76px);border-bottom:1px solid #ffffff12;background:#0b1020cc}
    .brand{display:inline-flex;align-items:center;gap:11px;font-size:16px;font-weight:750;letter-spacing:.08em}
    .brand-mark{width:34px;height:34px;display:grid;place-items:center;border:1px solid #6487ff55;border-radius:11px;background:linear-gradient(145deg,#3b64da,#8055da);box-shadow:0 6px 22px #554fe133;color:white}
    .brand-mark svg{width:19px;height:19px}
    .topnav{height:100%;display:flex;align-items:center;gap:28px;color:#98a4c1;font-size:14px}
    .topnav a{height:100%;display:flex;align-items:center;position:relative}
    .topnav a.active{color:#f2f5ff}
    .topnav a.active::after{content:"";position:absolute;bottom:0;left:0;right:0;height:2px;background:#8b9dff;border-radius:2px}
    .topbar-spacer{flex:1}
    .search{width:min(250px,28vw);height:38px;display:flex;align-items:center;gap:9px;padding:0 12px;border:1px solid #ffffff17;border-radius:9px;background:#ffffff08;color:#7f8aa7;transition:border-color .15s,box-shadow .15s}
    .search:focus-within{border-color:#7189ff88;box-shadow:0 0 0 3px #7189ff16}
    .search svg{width:16px;height:16px;flex:none}
    .search input{width:100%;border:0;outline:0;background:transparent;color:#e9edfa;font:inherit;font-size:13px}
    .search input::placeholder{color:#7f8aa7}
    .profile{width:36px;height:36px;display:grid;place-items:center;border:1px solid #ffffff1c;border-radius:50%;background:#1a2340;color:#b7c3e5}
    .profile svg{width:18px;height:18px}
    .profile-wrap{position:relative}
    .profile-button{padding:0;cursor:pointer}
    .profile-button:hover,.profile-button[aria-expanded="true"]{border-color:#8b9dff99;background:#27345a;color:#fff}
    .profile-button:focus-visible,.tab:focus-visible,.clear-search:focus-visible{outline:2px solid #9aabff;outline-offset:3px}
    .profile-menu{position:absolute;top:47px;right:0;z-index:5;width:210px;padding:8px;border:1px solid #ffffff18;border-radius:12px;background:#151d34;box-shadow:0 18px 45px #03081699}
    .profile-menu[hidden]{display:none}
    .profile-menu strong{display:block;padding:9px 10px 11px;color:#f0f3ff;font-size:13px}
    .profile-menu a{display:block;padding:9px 10px;border-radius:7px;color:#aeb9d5;font-size:13px}
    .profile-menu a:hover{background:#ffffff0c;color:#fff}
    main{width:min(1280px,100%);margin:0 auto;padding:54px clamp(20px,5vw,68px) 72px}
    .eyebrow{display:flex;align-items:center;gap:9px;margin:0 0 10px;color:#9ba8ce;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
    .eyebrow span{width:7px;height:7px;border-radius:50%;background:#88a0ff;box-shadow:0 0 12px #88a0ff}
    h1{margin:0;color:#f5f7ff;font-size:clamp(30px,4vw,42px);font-weight:650;letter-spacing:-.045em;line-height:1.15}
    .intro{margin:12px 0 0;color:#9ca8c4;font-size:15px;line-height:1.6}
    .toolbar{display:flex;align-items:center;gap:9px;margin-top:36px;padding-bottom:17px;border-bottom:1px solid #ffffff14}
    .tab{padding:9px 13px;border:1px solid transparent;border-radius:8px;background:transparent;color:#9ba7c3;font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
    .tab:hover{background:#ffffff0a;color:#e4eaff}
    .tab.active{border-color:#748bff44;background:#536dd521;color:#e4eaff}
    .count{margin-left:auto;color:#75819f;font-size:12px}
    .empty-state{min-height:370px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px;text-align:center}
    .empty-icon{width:76px;height:76px;display:grid;place-items:center;margin-bottom:22px;border:1px solid #8ba0ff26;border-radius:24px;background:linear-gradient(145deg,#202d52aa,#171c34aa);color:#a6b4ff;box-shadow:0 20px 60px #03081665,inset 0 1px #ffffff10}
    .empty-icon svg{width:34px;height:34px}
    .empty-state h2{margin:0;color:#e7ebfa;font-size:20px;font-weight:620;letter-spacing:-.02em}
    .empty-state p{max-width:390px;margin:10px 0 0;color:#8995b1;font-size:14px;line-height:1.65}
    .clear-search{display:none;margin-top:20px;padding:9px 13px;border:1px solid #748bff44;border-radius:8px;background:#536dd521;color:#dfe6ff;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
    .clear-search.visible{display:inline-flex}
    .library-note{display:inline-flex;align-items:center;gap:8px;margin-top:22px;padding:8px 11px;border:1px solid #ffffff12;border-radius:999px;background:#ffffff06;color:#8995b1;font-size:12px}
    .library-note svg{width:14px;height:14px;color:#8e9eff}
    @media(max-width:650px){.topbar{height:64px;gap:18px;padding:0 18px}.brand{font-size:0}.brand-mark{font-size:14px}.topnav{gap:17px;font-size:13px}.search{width:min(200px,32vw)}.profile{width:34px;height:34px}main{padding-top:40px}.toolbar{gap:4px}.tab{padding:8px 9px;font-size:12px}.empty-state{min-height:320px}}
    @media(max-width:390px){.topbar{gap:12px}.topnav{gap:12px}.search{width:36px;padding:0;justify-content:center;border-color:transparent;background:transparent}.search input{display:none}.search svg{width:19px;height:19px}}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="welcome.html" aria-label="Game Hub home"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8h10a4 4 0 0 1 3.8 5.2l-.7 2.3a2 2 0 0 1-3.3.9L14.5 14h-5l-2.3 2.4a2 2 0 0 1-3.3-.9l-.7-2.3A4 4 0 0 1 7 8Z"/><path d="M8 10v4M6 12h4M16 11h.01M18 13h.01"/></svg></span>GAME HUB</a>
    <nav class="topnav" aria-label="Main navigation"><a class="active" href="#library" aria-current="page">Library</a><a href="index.html">NDEx Home</a></nav>
    <span class="topbar-spacer"></span>
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="game-search" type="search" placeholder="Search games" aria-label="Search games"></label>
    <div class="profile-wrap">
      <button class="profile profile-button" id="profile-toggle" type="button" aria-label="Open player menu" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/></svg></button>
      <div class="profile-menu" id="profile-menu" role="menu" hidden><strong>Guest Player</strong><a href="index.html" role="menuitem">Return to NDEx</a></div>
    </div>
  </header>
  <main id="library">
    <p class="eyebrow"><span></span>Your collection</p>
    <h1>Game Library</h1>
    <p class="intro">Your games, all in one place.</p>
    <div class="toolbar" role="tablist" aria-label="Game library filters">
      <button class="tab active" type="button" role="tab" aria-selected="true" data-filter="all">All games</button>
      <button class="tab" type="button" role="tab" aria-selected="false" data-filter="favorites">Favorites</button>
      <button class="tab" type="button" role="tab" aria-selected="false" data-filter="recent">Recently played</button>
      <span class="count" id="game-count" aria-live="polite">0 games</span>
    </div>
    <section class="empty-state" aria-label="Game library results" aria-live="polite">
      <div class="empty-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8h10a4 4 0 0 1 3.8 5.2l-.7 2.3a2 2 0 0 1-3.3.9L14.5 14h-5l-2.3 2.4a2 2 0 0 1-3.3-.9l-.7-2.3A4 4 0 0 1 7 8Z"/><path d="M8 10v4M6 12h4M16 11h.01M18 13h.01"/></svg></div>
      <h2>No games yet</h2>
      <p>Your library is ready. Games will show up here when they’re added.</p>
      <button class="clear-search" id="clear-search" type="button">Clear search</button>
      <span class="library-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18"/></svg>Library is empty</span>
    </section>
  </main>
  <script>
    (() => {
      // The collection intentionally starts empty; new game entries can be added here later.
      const games = [];
      const tabs = [...document.querySelectorAll('[data-filter]')];
      const search = document.getElementById('game-search');
      const count = document.getElementById('game-count');
      const title = document.querySelector('.empty-state h2');
      const description = document.querySelector('.empty-state p');
      const clearSearch = document.getElementById('clear-search');
      const profileToggle = document.getElementById('profile-toggle');
      const profileMenu = document.getElementById('profile-menu');
      let activeFilter = 'all';

      function render() {
        const query = search.value.trim();
        const normalizedQuery = query.toLocaleLowerCase();
        const matches = games.filter(game => {
          const matchesFilter = activeFilter === 'all'
            || (activeFilter === 'favorites' && game.favorite)
            || (activeFilter === 'recent' && game.lastPlayed);
          return matchesFilter && (!normalizedQuery || game.title.toLocaleLowerCase().includes(normalizedQuery));
        });
        count.textContent = `${matches.length} ${matches.length === 1 ? 'game' : 'games'}`;
        if (matches.length) {
          title.textContent = 'Games are ready';
          description.textContent = `${matches.length} game${matches.length === 1 ? '' : 's'} in this view.`;
        } else if (query) {
          title.textContent = 'No games found';
          description.textContent = `There are no games matching “${query}”.`;
        } else if (activeFilter === 'favorites') {
          title.textContent = 'No favorites yet';
          description.textContent = 'Games you favorite will appear here.';
        } else if (activeFilter === 'recent') {
          title.textContent = 'Nothing played yet';
          description.textContent = 'Games you play will show up here.';
        } else {
          title.textContent = 'No games yet';
          description.textContent = 'Your library is ready. Games will show up here when they’re added.';
        }
        clearSearch.classList.toggle('visible', Boolean(query));
      }

      tabs.forEach(tab => tab.addEventListener('click', () => {
        activeFilter = tab.dataset.filter;
        tabs.forEach(item => {
          const selected = item === tab;
          item.classList.toggle('active', selected);
          item.setAttribute('aria-selected', String(selected));
        });
        render();
      }));
      search.addEventListener('input', render);
      clearSearch.addEventListener('click', () => { search.value = ''; search.focus(); render(); });
      profileToggle.addEventListener('click', () => {
        const open = profileToggle.getAttribute('aria-expanded') !== 'true';
        profileToggle.setAttribute('aria-expanded', String(open));
        profileMenu.hidden = !open;
      });
      document.addEventListener('click', event => {
        if (!event.target.closest('.profile-wrap')) {
          profileMenu.hidden = true;
          profileToggle.setAttribute('aria-expanded', 'false');
        }
      });
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape') {
          profileMenu.hidden = true;
          profileToggle.setAttribute('aria-expanded', 'false');
        }
      });
    })();
  </script>
</body>
</html>
