<!doctype html><html class="login-pf"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    
    <meta name="robots" content="noindex, nofollow">

            <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sign in to ndex</title>
    <link rel="icon" href="https://www.ndexbio.org/auth2/resources/bvgro/login/keycloak/img/favicon.ico">
            <link href="./ndex login_files/patternfly.min.css" rel="stylesheet">
            <link href="./ndex login_files/patternfly(1).min.css" rel="stylesheet">
            <link href="./ndex login_files/patternfly-additions.min.css" rel="stylesheet">
            <link href="./ndex login_files/pficon.css" rel="stylesheet">
            <link href="./ndex login_files/login.css" rel="stylesheet">
    
    
    
<style>
@font-face{font-family:Open Sans;src:url("assets/fonts/OpenSans-Light.ttf") format("truetype");font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:Open Sans;src:url("assets/fonts/OpenSans-Regular.ttf") format("truetype");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:Open Sans;src:url("assets/fonts/OpenSans-SemiBold.ttf") format("truetype");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:Open Sans;src:url("assets/fonts/OpenSans-Bold.ttf") format("truetype");font-weight:700;font-style:normal;font-display:swap}
html.login-pf,html.login-pf body{width:100%;height:100%;min-height:100%;margin:0;background:#202020 url("login-background.png") center center/cover no-repeat fixed}
html.login-pf body{display:block;color:#111;font-family:"Open Sans",Arial,sans-serif}
.login-pf-page{position:relative;display:flex;flex-direction:column;align-items:center;width:100%;max-width:none;min-height:100vh;min-height:100dvh;margin:0;padding:104px 18px 40px;background:transparent;box-sizing:border-box}
.login-pf-page *{box-sizing:border-box}
#kc-header{flex:none;width:min(625px,100%);height:43.2px;margin:0 0 74px;color:#ededed;text-align:center;overflow:visible}
#kc-header-wrapper{padding:0;font-size:36px;font-weight:300;line-height:1.2;letter-spacing:4px;text-transform:uppercase;white-space:normal}
.card-pf{position:relative;flex:none;width:min(625px,100%);height:614px;margin:0;padding:0;border:0;border-top:5px solid #0066cc;border-radius:0;background:#fff;box-shadow:0 4px 20px rgba(0,0,0,.18);overflow:hidden}
#kc-page-title{position:absolute;top:38px;left:0;width:100%;margin:0;color:#151515;font-size:28px;font-weight:300;line-height:38px;text-align:center}
#kc-content{position:absolute;inset:0;width:100%}
#kc-content-wrapper{position:absolute;inset:0;margin:0;padding:0}
#kc-form,#kc-form-wrapper{position:static;width:100%;margin:0}
#kc-form-login{position:static;margin:0}
#login-error{position:absolute;top:103px;left:50px;right:50px;margin:0;color:#c9190b;font-size:13px}
#kc-form-login>.form-group{position:absolute;left:50px;right:50px;margin:0}
#kc-form-login>.form-group:nth-child(2){top:110px}
#kc-form-login>.form-group:nth-child(3){top:200px}
#kc-form-login>.form-group:nth-child(4){top:289px}
.pf-c-form__label{display:block;margin:0 0 3px;color:#333;font-size:14px;font-weight:400;line-height:20px}
.pf-c-form-control{display:block;width:100%;height:45px;padding:7px 10px;border:1px solid #c8c8c8;border-radius:0;background:#fff;color:#111;font:14px "Open Sans",Arial,sans-serif;box-shadow:none}
.pf-c-form-control:focus{border:2px solid #151515;outline:0;box-shadow:none}
.pf-c-input-group{display:flex;width:100%}
.pf-c-input-group .pf-c-form-control{flex:1;min-width:0}
.pf-c-input-group .pf-c-button{position:relative;flex:none;width:60px;height:45px;border:1px solid #d5d5d5;border-left:0;border-radius:0;background:#fff;color:#111;cursor:pointer}
.pf-c-input-group .pf-c-button:hover{background:#f7f7f7}
.pf-c-input-group .pf-c-button i{font-size:0}
.pf-c-input-group .pf-c-button::before{content:"";position:absolute;left:20px;top:15px;width:17px;height:11px;border:2px solid #111;border-radius:80% 20%;transform:rotate(0deg)}
.pf-c-input-group .pf-c-button::after{content:"";position:absolute;left:27px;top:18px;width:6px;height:6px;border:1.5px solid #111;border-radius:50%;background:#111}
.login-pf-settings{display:flex;justify-content:flex-end;margin:0}
.login-pf-settings a,#kc-info a{color:#0099d3;text-decoration:none}
.login-pf-settings a:hover,#kc-info a:hover{text-decoration:underline}
#kc-form-buttons{position:absolute;top:336px;left:50px;right:50px;margin:0}
.pf-m-primary{display:block;width:100%;height:39px;border:0;border-radius:0;background:#0066cc;color:#fff;font-size:16px;font-weight:600;cursor:pointer}
.pf-m-primary:hover{background:#005bb8}
#kc-social-providers{position:absolute;top:399px;left:50px;right:50px;margin:0;color:#777;text-align:center}
#kc-social-providers hr{height:1px;margin:0 0 24px;border:0;background:#ececec}
#kc-social-providers h2{margin:0 0 22px;color:#777;font-size:14px;font-weight:400;line-height:20px;text-align:center}
#kc-social-providers ul{margin:0;padding:0;list-style:none}
#kc-social-providers li{margin:0}
.kc-social-item{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:43px;margin:0;border:1px solid #e5e5e5;border-bottom-color:#999;border-radius:0;background:#fff;color:#111;text-decoration:none}
.kc-social-item:hover{background:#fafafa}
.kc-social-provider-logo{position:absolute;left:24px;float:none;width:auto;height:auto;color:#687b8b;font-family:Arial,sans-serif;font-size:25px;font-weight:700;line-height:1}
.kc-social-provider-logo::before{content:"G"}
.kc-social-provider-name{position:static;font-size:16px}
.login-pf-signup{position:absolute;right:0;bottom:0;left:0;display:grid;height:65px;margin:0;padding:0 16px;place-items:center;background:#f1f1f1;color:#777;text-align:center;font-size:15px}
.login-pf-signup #kc-info-wrapper{padding:0;background:transparent;font-size:15px}
@media(max-width:767px){html.login-pf body{background:#202020 url("login-background.png") center center/cover no-repeat fixed}.login-pf-page{padding:40px 14px 24px}#kc-header{margin-bottom:36px}#kc-header-wrapper{font-size:30px}.card-pf{height:614px;max-width:625px}#kc-content-wrapper{padding:0}#kc-form-login>.form-group{left:24px;right:24px}#login-error{left:24px;right:24px}#kc-form-buttons{left:24px;right:24px}#kc-social-providers{right:24px;left:24px}}
@media(max-height:760px) and (min-width:768px){.login-pf-page{padding-top:36px}#kc-header{margin-bottom:28px}}
</style></head><body>
<div class="login-pf-page">
    <div id="kc-header" class="login-pf-page-header">
        <div id="kc-header-wrapper" class="">ndex</div>
    </div>
    <div class="card-pf">
        <header class="login-pf-header">
                <h1 id="kc-page-title">        Sign in to your account

</h1>
      </header>
      <div id="kc-content">
        <div id="kc-content-wrapper">


        <div id="kc-form">
          <div id="kc-form-wrapper">
                <form id="kc-form-login" action="#" method="post"><div id="login-error" role="status" aria-live="polite" style="color:#c9190b;margin:6px 0;font-size:13px"></div>
                        <div class="form-group">
                            <label for="username" class="pf-c-form__label pf-c-form__label-text">Username or email</label>

                            <input tabindex="2" id="username" class="pf-c-form-control" name="username" value="" type="text" autofocus="" autocomplete="username" aria-invalid="">


                        </div>

                    <div class="form-group">
                        <label for="password" class="pf-c-form__label pf-c-form__label-text">Password</label>

                        <div class="pf-c-input-group">
                            <input tabindex="3" id="password" class="pf-c-form-control" name="password" type="password" autocomplete="current-password" aria-invalid="">
                            <button class="pf-c-button pf-m-control" type="button" aria-label="Show password" aria-controls="password" data-password-toggle="" tabindex="4" data-icon-show="fa fa-eye" data-icon-hide="fa fa-eye-slash" data-label-show="Show password" data-label-hide="Hide password">
                                <i class="fa fa-eye" aria-hidden="true"></i>
                            </button>
                        </div>


                    </div>

                    <div class="form-group login-pf-settings">
                        <div id="kc-form-options">
                            </div>
                            <div class="">
                                    <span><a tabindex="6" href="https://www.ndexbio.org/auth2/realms/ndex/login-actions/reset-credentials?client_id=cytoscapendex&amp;tab_id=3i09lFG38W4&amp;client_data=eyJydSI6Imh0dHBzOi8vd3d3Lm5kZXhiaW8ub3JnL215LWFjY291bnQiLCJydCI6ImNvZGUiLCJybSI6ImZyYWdtZW50Iiwic3QiOiI4YTljNGZmNS1kNjYyLTQ1M2YtOGEyMC04NTFjMTUzMzYyMGUifQ">Forgot Password?</a></span>
                            </div>

                      </div>

                      <div id="kc-form-buttons" class="form-group">
                          <input type="hidden" id="id-hidden-input" name="credentialId">
                          <input tabindex="7" class="pf-c-button pf-m-primary pf-m-block btn-lg" name="login" id="kc-login" type="submit" value="Sign In">
                      </div>
                </form>
            </div>
        </div>
        



            <div id="kc-social-providers" class="kc-social-section kc-social-gray">
                <hr>
                <h2>Or sign in with</h2>

                <ul class="pf-c-login__main-footer-links kc-social-links ">
                        <li>
                            <a id="social-google" class="pf-c-button pf-m-control pf-m-block kc-social-item kc-social-gray " type="button" href="#">
                                    <i class="kc-social-provider-logo kc-social-gray fa fa-google" aria-hidden="true"></i>
                                    <span class="kc-social-provider-name kc-social-icon-text">Google</span>
                            </a>
                        </li>
                </ul>
            </div>


              <div id="kc-info" class="login-pf-signup">
                  <div id="kc-info-wrapper" class="">
            <div id="kc-registration-container">
                <div id="kc-registration">
                    <span>New user? <a id="register-link" tabindex="8" href="#">Register</a></span>
                </div>
            </div>

                  </div>
              </div>
        </div>
      </div>

    </div>
  </div>


<script>
(() => {
 const form=document.getElementById('kc-form-login'), user=document.getElementById('username'), pass=document.getElementById('password'), error=document.getElementById('login-error');
 form.addEventListener('submit',event=>{event.preventDefault();if(user.value.trim()==='snoopdoggtrump'&&pass.value==='')location.href='welcome.html';else error.textContent='Unable to sign in with those credentials.';});
 document.getElementById('social-google')?.addEventListener('click',event=>event.preventDefault());
 document.getElementById('register-link')?.addEventListener('click',event=>event.preventDefault());
 const toggle=document.querySelector('[data-password-toggle]');
 toggle?.addEventListener('click',()=>{const visible=pass.type==='password';pass.type=visible?'text':'password';toggle.setAttribute('aria-label',visible?'Hide password':'Show password');const icon=toggle.querySelector('i');if(icon)icon.className=visible?'fa fa-eye-slash':'fa fa-eye';});
})();
</script></body></html>
